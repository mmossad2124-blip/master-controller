<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Cloud SOC Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .chat-container { max-height: calc(100vh - 160px); overflow-y: auto; }
        .message-in { background-color: #1e293b; border-right: 4px solid #3b82f6; }
        .message-out { background-color: #3b82f6; color: white; }
        .thinking { color: #94a3b8; font-style: italic; font-size: 0.9em; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 p-4 shadow-lg border-b border-slate-700 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-shield-halved text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-bold">Cloud Agent SOC <span class="text-xs bg-blue-600 px-2 py-1 rounded ml-2">v2.0</span></h1>
        </div>
        <div class="flex items-center gap-2 text-sm text-green-400">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            Connected
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 chat-container p-4 space-y-4">
        <!-- Welcome Message -->
        <div class="flex flex-col gap-1 items-start">
            <div class="message-in p-3 rounded-lg rounded-tr-none shadow max-w-[85%]">
                مرحباً بك في واجهة <b>Enterprise Cloud Agent</b>. أنا وكيلك الأمني المستقل. 
                أعمل بالكامل عبر السحابة، ويمكنك استدعائي من أي جهاز (هاتف أو لابتوب). 
                كيف يمكنني مساعدتك اليوم؟ (مثلاً: افحص رابط معين، أو اكتب ترقيع لكود).
            </div>
        </div>
    </main>

    <!-- Thinking Indicator (Hidden) -->
    <div id="thinking-indicator" class="hidden px-4 pb-2 thinking animate-pulse">
        <i class="fa-solid fa-microchip mr-2"></i> <span id="thinking-text">الوكيل المستقل يفكر...</span>
    </div>

    <!-- Input Area -->
    <footer class="bg-slate-800 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-10">
        <form id="chat-form" class="flex gap-2 max-w-4xl mx-auto">
            <input type="text" id="user-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-white" placeholder="اكتب أمرك هنا للوكيل..." autocomplete="off">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 transition px-6 py-3 rounded-lg font-bold">
                إرسال <i class="fa-solid fa-paper-plane ml-1"></i>
            </button>
        </form>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const thinkingIndicator = document.getElementById('thinking-indicator');
        const thinkingText = document.getElementById('thinking-text');

        // Determine WebSocket URL based on current host
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/agent`;
        
        let ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log("Connected to Agent WebSocket");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === "status") {
                thinkingIndicator.classList.remove('hidden');
                thinkingText.innerText = data.message;
                chatBox.scrollTop = chatBox.scrollHeight;
            } else if (data.type === "message" || data.type === "error") {
                thinkingIndicator.classList.add('hidden');
                
                // Format response (basic markdown to html)
                let text = data.message
                    .replace(/\n/g, '<br>')
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                    .replace(/`(.*?)`/g, '<code class="bg-slate-900 text-pink-400 px-1 rounded">$1</code>');
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'flex flex-col gap-1 items-start mb-4';
                msgDiv.innerHTML = `
                    <div class="message-in p-3 rounded-lg rounded-tr-none shadow max-w-[90%] md:max-w-[80%]">
                        ${data.type === "error" ? '<span class="text-red-400"><i class="fa-solid fa-circle-exclamation"></i> خطأ:</span> ' : ''}
                        ${text}
                    </div>
                `;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        ws.onclose = () => {
            thinkingIndicator.classList.remove('hidden');
            thinkingIndicator.classList.remove('animate-pulse');
            thinkingIndicator.classList.add('text-red-400');
            thinkingText.innerText = "فقدت الاتصال بالخادم السحابي. يرجى تحديث الصفحة.";
        };

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = userInput.value.trim();
            if (!msg) return;

            // Add user message to UI
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex flex-col gap-1 items-end mb-4';
            msgDiv.innerHTML = `
                <div class="message-out p-3 rounded-lg rounded-tl-none shadow max-w-[85%] md:max-w-[70%]">
                    ${msg}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Send to WebSocket
            ws.send(msg);
            userInput.value = '';
            
            // Show thinking
            thinkingIndicator.classList.remove('hidden');
            thinkingText.innerText = "جاري إرسال الطلب عبر السحابة...";
        });
    </script>
</body>
</html>
